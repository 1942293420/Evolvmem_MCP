[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "evolvmem"
version = "0.1.0"
description = "EvolvMem — evolving memory plugin for Claude Code with FTS5/trigram + HNSW vector search"
requires-python = ">=3.10"
dependencies = [
    "usearch>=2.14",
    "llama-cpp-python>=0.3.0",
    "numpy>=1.24",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[tool.setuptools.packages.find]
include = ["evolvmem*"]
