er.py:116"]}, {"id": "lex", "label": "关键词与标识符匹配", "x": 80, "y": 210, "w": 270, "h": 80, "shape": "action", "tone": "normal", "detail": "SQLite FTS5 搜索 L0/L1，补充自然语言中的错误码、代码标识符；资格限制在候选预算前生效。", "inputs": "问题文字、标识符、合格范围", "outputs": "全文匹配候选、命中层与分数", "evidence": ["evolvmem/context_retriever.py:116"]}, {"id": "vec", "label": "问题向量与语义近邻", "x": 880, "y": 210, "w": 270, "h": 80, "shape": "action", "tone": "normal", "detail": "对问题编码，按范围查 USearch；向量不可用时不会虚构语义命中。当前模型配置为 BGE-base-zh-v1.5，768 维。", "inputs": "查询向量、范围内已索引文档", "outputs": "语义近邻及距离；不可用时无此路候选", "evidence": ["evolvmem/context_retriever.py:1", "evolvmem/embedding.py:1", "evolvmem/vector_index.py:1"], "jump": "index"}, {"id": "merge", "label": "合并候选并核对资格", "x": 465, "y": 365, "w": 270, "h": 80, "shape": "action", "tone": "normal", "detail": "合并词面和向量候选；再次核对状态、项目、有效期与被替代时间。这里只收集和过滤候选，还没确定最终顺序。", "inputs": "词面与向量候选、条目元数据", "outputs": "合并且资格有效的候选", "evidence": ["evolvmem/context_retriever.py:116"]}, {"id": "rerank", "label": "比较问题与候选内容", "x": 465, "y": 505, "w": 270, "h": 80, "shape": "action", "tone": "normal", "detail": "重排器可用时比较问题和 L0 + L1 内容，相关性优先排序；失败时回退既有门槛。当前配置为本地 mMarco 重排目录。", "inputs": "问题、候选 L0 与有限 L1 内容", "outputs": "重排相关性分数或失败回退结果", "evidence": ["evolvmem/context_retriever.py:229", "evolvmem/reranking.py:1"]}, {"id": "output", "label": "筛选、去重并限量返回", "x": 465, "y": 640, "w": 270, "h": 80, "shape": "action", "tone": "good", "detail": "检查语义/重排门槛，弱语义补召回还检查问题主体；按当前适用版本和完整指纹去重后取 top_k。knowledge_recall 外层还会对历史摘要或问答做排序与预算裁剪。", "inputs": "候选分数、门槛、版本及内容指纹", "outputs": "排序去重的 L0 结果、引用与命中通道", "evidence": ["evolvmem/context_retriever.py:236", "evolvmem/memory_recall.py:26"]}], "edges": [{"id": "e0", "source": "query", "target": "lex", "points": [[530, 125], [530, 170], [215, 170], [215, 210]], "label": "词面通道", "lx": 335, "ly": 151, "kind": "arrow", "payload": "词面通道"}, {"id": "e1", "source": "query", "target": "vec", "points": [[670, 125], [670, 170], [1015, 170], [1015, 210]], "label": "语义通道", "lx": 870, "ly": 151, "kind": "a function showEdge(id){const e=active.edges.find(e=>e.id===id);if(!e)return;state().selected=null;state().relation=id;clearMarks();$('details').hidden=false;$('detail-title').textContent=active.reading==='relationship'?'查看关系':'查看一次交接';$('detail-content').replaceChildren();document.querySelector('[data-edge="'+id+'"]').classList.add('current');for(const k of [e.source,e.target])document.querySelector('[data-node="'+k+'"]').classList.add('related');block('两端节点',name(e.source)+(e.kind==='association'?' — ':' → ')+name(e.target));block(active.reading==='relationship'?'关系含义':'传递内容',e.payload);for(const k of [e.source,e.target]){const b=document.createElement('button');b.className='related-jump';b.textContent='查看：'+name(k);b.onclick=()=>{pause();clearMarks();detail(k)};$('detail-content').append(b)}evidence(active.sources);cache()}
function route(){return active.routes[state().route]}
function routeLength(){return (route().edge_ids||route().ids).length}
function traceEdge(e){stopTrace();if(!playing||reduced.matches||active.reading==='relationship'||e.kind==='association')return;const svg=document.querySelector('#canvas svg'),path=svg.querySelector('[data-edge="'+e.id+'"]'),dot=document.createElementNS(NS,'circle');dot.setAttribute('r','7');dot.setAttribute('class','trace-dot');svg.append(dot);const start=performance.now(),duration=1700/speed,total=path.getTotalLength();function tick(now){const progress=Math.min(1,(now-start)/duration),p=path.getPointAtLength(total*progress);dot.setAttribute('cx',p.x);dot.setAttribute('cy',p.y);if(progress<1&&playing)frame=requestAnimationFrame(tick);else{dot.remove();frame=null}}frame=requestAnimationFrame(tick)}
function markStep(){clearMarks();stopTrace();const s=state(),r=route();if(s.step<0){$('step-strip').hidden=true;return}let id,e;if(r.edge_ids){e=active.edges.find(e=>e.id===r.edge_ids[s.step]);id=e.target}else{id=r.ids[s.step];if(s.step>0){const es=active.edges.filter(e=>e.source===r.ids[s.step-1]&&e.target===id);if(es.length===1)e=es[0]}}
 detail(id);document.querySelector('[data-node="'+id+'"]').classList.add('current');document.querySelectorAll('#canvas .edge').forEach(g=>g.classList.remove('near'));if(e)document.querySelector('[data-edge="'+e.id+'"]').classList.add('current');$('step-strip').hidden=false;$('step-counter').textContent=(s.step+1)+' / '+routeLength();$('step-payload').textContent=active.reading==='relationship'?'关系解读 · '+name(id):e?name(e.source)+' → '+name(e.target)+'　｜　'+e.payload:'开始 · '+name(id);$('prev').disabled=s.step<=0;$('next').disabled=s.step>=routeLength()-1;if(e)traceEdge(e);if(!state().autoFit)requestAnimationFrame(()=>document.querySelector('.node.current')?.scrollIntoView({block:'nearest',inline:'nearest'}));cache()}
function step(delta){state().step=Math.max(0,Math.min(routeLength()-1,state().step+delta));markStep()}
function schedule(){clearTimeout(timer);if(!playing)return;if(state().step>=routeLength()-1){timer=setTimeout(pause,1900/speed);return}timer=setTimeout(()=>{step(1);schedule()},2500/speed)}
function reset(){pause();state().step=-1;state().selected=null;state().relation=null;clearMarks();$('details').hidden=true;$('step-strip').hidden=true;$('prev').disabled=true;$('next').disabled=false;cache()}
function renderNav(){const nav=$('nav');nav.replaceChildren();let group='';const q=search.trim().toLowerCase();for(const [i,c] of charts.entries()){const matching=c.nodes.filter(n=>(n.label+' '+n.detail).toLowerCase().includes(q));if(q&&!(c.title+c.kind).toLowerCase().includes(q)&&!matching.length)continue;if(c.group!==group){group=c.group;const h=document.createElement('div');h.className='nav-group';h.textContent=group;nav.append(h)}const b=document.createElement('button');b.className='nav-item';b.dataset.chart=c.id;b.setAttribute('aria-selected',String(c.id===active?.id));const top=document.createElement('span'),title=document.createElement('span');top.className='nav-top';top.textContent=String(i+1).padStart(2,'0')+' · '+c.kind;title.className='nav-name';title.textContent=c.title;b.append(top,title);b.onclick=()=>render(c.id);nav.append(b);if(q)for(const n of matching.slice(0,5)){const hit=document.createElement('button');hit.className='node-result';hit.textContent=n.label.replaceAll('|',' · ');hit.onclick=()=>{render(c.id);detail(n.id);document.querySelector('[data-node="'+n.id+'"]').scrollIntoView({block:'nearest',inline:'nearest'})};nav.append(hit)}}if(!nav.children.length){const p=document.createElement('p');p.id='nav-empty';p.textContent='没有匹配的图或节点';nav.append(p)}}
function legend(){const el=$('legend');el.replaceChildren();const texts=active.reading==='relationship'?[active.kind==='类图'?'类名 / 属性 / 方法':'节点表示业务对象','连线表示关联，不表示执行顺序']:active.kind.includes('泳道')?['泳道表示责任方','菱形表示条件判断','箭头表示控制推进']:active.kind.includes('数据流')?['矩形：外部参与者','圆形：处理过程','双线：资料存储','箭头：数据交接']:active.reading==='sequence'?['从上向下是调用时间','实线：请求','虚线：返回']:['点击节点查看输入与输出','点击连线查看交接内容'];for(const text of texts){const s=document.createElement('span');s.textContent=text;el.append(s)}}
function render(id){saveView();pause();active=charts.find(c=>c.id===id)||charts[0];const s=state();s.route=Math.max(0,Math.min(s.route||0,active.routes.length-1));s.step=Math.max(-1,Math.min(s.step??-1,routeLength()-1));$('kind').textContent=active.group+' / '+active.kind;$('title').textContent=active.title;$('question').textContent=active.question;$('canvas').innerHTML=active.svg;$('routes').replaceChildren();active.routes.forEach((r,i)=>{const o=document.createElement('option');o.value=i;o.textContent=r.label;$('routes').append(o)});$('routes').value=s.route;$('details').hidden=true;$('step-strip').hidden=true;$('prev').disabled=true;$('next').disabled=false;$('play').textContent=active.reading==='relationship'?'逐项讲解':'播放过程';renderNav();legend();if(s.autoFit||!s.zoom)fit();else scale(s.zoom);$('viewport').scrollTo(s.x||0,s.y||0);if(s.step>=0)markStep();else if(s.selected)detail(s.selected);else if(s.relation)showEdge(s.relation);try{history.replaceState(null,'','#'+active.id)}catch{}cache()}
$('canvas').addEventListener('click',ev=>{const n=ev.target.closest('[data-node]'),e=ev.target.closest('[data-relation]');if(n){pause();clearMarks();detail(n.dataset.node)}else if(e){pause();showEdge(e.dataset.relation)}});$('canvas').addEventListener('keydown',ev=>{if(['Enter',' '].includes(ev.key)){const n=ev.target.closest('[data-node]'),e=ev.target.closest('[data-relation]');if(n||e){ev.preventDefault();ev.target.dispatchEvent(new MouseEvent('click',{bubbles:true}))}}});
$('close').onclick=()=>{$('details').hidden=true;state().selected=null;state().relation=null;document.querySelectorAll('#canvas .selected,#canvas .near,#canvas .related').forEach(n=>n.classList.remove('selected','near','related'));cache()};$('reset').onclick=reset;$('prev').onclick=()=>{pause();step(-1)};$('next').onclick=()=>{pause();step(1)};$('routes').onchange=()=>{state().route=Number($('routes').value);reset()};$('play').onclick=()=>{if(playing){pause();return}if(state().step>=routeLength()-1)state().step=-1;if(reduced.matches){step(1);notify('已按减少动画设置，逐步查看');return}playing=true;$('play').textContent='暂停播放';step(1);schedule()};$('speed').onchange=()=>{speed=Number($('speed').value);if(playing){stopTrace();schedule()}};
$('finder').value=search;$('finder').oninput=()=>{search=$('finder').value;renderNav();cache()};$('clear-search').onclick=()=>{$('finder').value='';search='';renderNav();cache();$('finder').focus()};$('theme').onclick=()=>setTheme(!document.documentElement.classList.contains('dark'));$('plus').onclick=()=>scale(state().zoom+.15);$('minus').onclick=()=>scale(state().zoom-.15);$('fit').onclick=fit;$('present').onclick=()=>{document.body.classList.toggle('present');$('present').textContent=document.body.classList.contains('present')?'返回目录':'专注看图';fit()};
let drag=null;const viewport=$('viewport');viewport.addEventListener('pointerdown',e=>{if(e.button!==0||e.target.closest('[data-node],[data-relation]'))return;drag={x:e.clientX,y:e.clientY,left:viewport.scrollLeft,top:viewport.scrollTop};viewport.setPointerCapture(e.pointerId);viewport.classList.add('dragging')});viewport.addEventListener('pointermove',e=>{if(!drag)return;viewport.scrollLeft=drag.left+drag.x-e.clientX;viewport.scrollTop=drag.top+drag.y-e.clientY});function endDrag(){drag=null;viewport.classList.remove('dragging');saveView()}viewport.addEventListener('pointerup',endDrag);viewport.addEventListener('pointercancel',endDrag);viewport.addEventListener('wheel',e=>{if(e.ctrlKey||e.metaKey){e.preventDefault();scale(state().zoom+(e.deltaY<0?.1:-.1))}},{passive:false});
function canonical(){const clone=document.querySelector('#canvas svg').cloneNode(true),root=getComputedStyle(document.documentElement);clone.style.width='';clone.style.height='';clone.querySelectorAll('.trace-dot,.edge-hit').forEach(n=>n.remove());clone.querySelectorAll('.current,.selected,.near,.related').forEach(n=>n.classList.remove('current','selected','near','related'));for(const key of ['ink','surface','node-stroke','edge','accent','lane','border','good-bg','candidate-bg','review-bg'])clone.style.setProperty('--'+key,root.getPropertyValue('--'+key));const bg=document.createElementNS(NS,'rect');bg.setAttribute('width','100%');bg.setAttribute('height','100%');bg.setAttribute('fill',root.getPropertyValue('--surface'));clone.insertBefore(bg,clone.querySelector('defs').nextSibling);return new XMLSerializer().serializeToString(clone)}
function download(blob,ext){const url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='evolvmem-'+active.id+'.'+ext;a.click();setTimeout(()=>URL.revokeObjectURL(url),1500)}$('export').onclick=()=>{download(new Blob([canonical()],{type:'image/svg+xml;charset=utf-8'}),'svg');notify('已导出整张图纸')};$('png').onclick=async()=>{const b=$('png');b.disabled=true;try{const url=URL.createObjectURL(new Blob([canonical()],{type:'image/svg+xml;charset=utf-8'}));try{const img=new Image();await new Promise((resolve,reject)=>{img.onload=resolve;img.onerror=reject;img.src=url});const canvas=document.createElement('canvas');canvas.width=active.width*2;canvas.height=active.height*2;canvas.getContext('2d').drawImage(img,0,0,canvas.width,canvas.height);const blob=await new Promise(resolve=>canvas.toBlob(resolve,'image/png'));if(!blob)throw Error('empty image');download(blob,'png');notify('已导出整张图片')}finally{URL.revokeObjectURL(url)}}catch{notify('图片导出失败，可使用 SVG 导出')}finally{b.disabled=false}};
const intro=document.createElement('p');intro.textContent='依据当前源码、数据结构与只读快照绘制。动画用于解释已声明的关系，不是实时请求监控；功能存在、当前启用和全链路验收分别核对。';$('audit-body').append(intro);for(const section of auditData.sections){const h=document.createElement('h2');h.textContent=section.title;const wrap=document.createElement('div');wrap.className='audit-scroll';const table=document.createElement('table');section.rows.forEach((row,i)=>{const tr=document.createElement('tr');for(const val of row){const cell=document.createElement(i?'td':'th');cell.textContent=String(val);tr.append(cell)}table.append(tr)});wrap.append(table);$('audit-body').append(h,wrap)}const note=document.createElement('p');note.textContent='源码版本：'+auditData.commit+'。各节点可展开源码依据；快照不会自动刷新。';$('audit-body').append(note);$('audit').onclick=()=>{pause();$('audit-dialog').showModal()};$('audit-close').onclick=()=>$('audit-dialog').close();document.addEventListener('keydown',e=>{if(e.key==='Escape'){pause();$('close').click()}if(e.key==='/'&&!['INPUT','TEXTAREA','SELECT'].includes(document.activeElement.tagName)) {e.preventDefault();$('finder').focus()}});document.addEventListener('visibilitychange',()=>{if(document.hidden)pause()});reduced.addEventListener('change',()=>{if(reduced.matches)pause()});window.addEventListener('beforeunload',saveView);window.addEventListener('hashchange',()=>{if(location.hash.slice(1)!==active.id)render(location.hash.slice(1))});
setTheme(Boolean(remembered.dark));render(location.hash.slice(1)||remembered.active||'journey');new ResizeObserver(()=>{if(active&&state().autoFit)fit()}).observe($('viewport'));window.__atlas={charts,select:render,getActive:()=>active.id,getState:()=>({...state()}),isPlaying:()=>playing,pause,showEdge,canonical};
