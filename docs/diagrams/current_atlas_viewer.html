$('finder').value=search;$('finder').oninput=()=>{search=$('finder').value;renderNav();cache()};$('clear-search').onclick=()=>{$('finder').value='';search='';renderNav();cache();$('finder').focus()};$('theme').onclick=()=>setTheme(!document.documentElement.classList.contains('dark'));$('plus').onclick=()=>scale(state().zoom+.15);$('minus').onclick=()=>scale(state().zoom-.15);$('fit').onclick=fit;$('present').onclick=()=>{document.body.classList.toggle('present');$('present').textContent=document.body.classList.contains('present')?'返回目录':'专注看图';fit()};
let drag=null;const viewport=$('viewport');viewport.addEventListener('pointerdown',e=>{if(e.button!==0||e.target.closest('[data-node],[data-relation]'))return;drag={x:e.clientX,y:e.clientY,left:viewport.scrollLeft,top:viewport.scrollTop};viewport.setPointerCapture(e.pointerId);viewport.classList.add('dragging')});viewport.addEventListener('pointermove',e=>{if(!drag)return;viewport.scrollLeft=drag.left+drag.x-e.clientX;viewport.scrollTop=drag.top+drag.y-e.clientY});function endDrag(){drag=null;viewport.classList.remove('dragging');saveView()}viewport.addEventListener('pointerup',endDrag);viewport.addEventListener('pointercancel',endDrag);viewport.addEventListener('wheel',e=>{if(e.ctrlKey||e.metaKey){e.preventDefault();scale(state().zoom+(e.deltaY<0?.1:-.1))}},{passive:false});
function canonical(){const clone=document.querySelector('#canvas svg').cloneNode(true),root=getComputedStyle(document.documentElement);clone.style.width='';clone.style.height='';clone.querySelectorAll('.trace-dot,.edge-hit').forEach(n=>n.remove());clone.querySelectorAll('.current,.selected,.near,.related').forEach(n=>n.classList.remove('current','selected','near','related'));for(const key of ['ink','surface','node-stroke','edge','accent','lane','border','good-bg','candidate-bg','review-bg'])clone.style.setProperty('--'+key,root.getPropertyValue('--'+key));const bg=document.createElementNS(NS,'rect');bg.setAttribute('width','100%');bg.setAttribute('height','100%');bg.setAttribute('fill',root.getPropertyValue('--surface'));clone.insertBefore(bg,clone.querySelector('defs').nextSibling);return new XMLSerializer().serializeToString(clone)}
function download(blob,ext){const url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='evolvmem-'+active.id+'.'+ext;a.click();setTimeout(()=>URL.revokeObjectURL(url),1500)}$('export').onclick=()=>{download(new Blob([canonical()],{type:'image/svg+xml;charset=utf-8'}),'svg');notify('已导出整张图纸')};$('png').onclick=async()=>{const b=$('png');b.disabled=true;try{const url=URL.createObjectURL(new Blob([canonical()],{type:'image/svg+xml;charset=utf-8'}));try{const img=new Image();await new Promise((resolve,reject)=>{img.onload=resolve;img.onerror=reject;img.src=url});const canvas=document.createElement('canvas');canvas.width=active.width*2;canvas.height=active.height*2;canvas.getContext('2d').drawImage(img,0,0,canvas.width,canvas.height);const blob=await new Promise(resolve=>canvas.toBlob(resolve,'image/png'));if(!blob)throw Error('empty image');download(blob,'png');notify('已导出整张图片')}finally{URL.revokeObjectURL(url)}}catch{notify('图片导出失败，可使用 SVG 导出')}finally{b.disabled=false}};
const intro=document.createElement('p');intro.textContent='依据当前源码、数据结构与只读快照绘制。动画用于解释已声明的关系，不是实时请求监控；功能存在、当前启用和全链路验收分别核对。';$('audit-body').append(intro);for(const section of auditData.sections){const h=document.createElement('h2');h.textContent=section.title;const wrap=document.createElement('div');wrap.className='audit-scroll';const table=document.createElement('table');section.rows.forEach((row,i)=>{const tr=document.createElement('tr');for(const val of row){const cell=document.createElement(i?'td':'th');cell.textContent=String(val);tr.append(cell)}table.append(tr)});wrap.append(table);$('audit-body').append(h,wrap)}const note=document.createElement('p');note.textContent='源码版本：'+auditData.commit+'。各节点可展开源码依据；快照不会自动刷新。';$('audit-body').append(note);$('audit').onclick=()=>{pause();$('audit-dialog').showModal()};$('audit-close').onclick=()=>$('audit-dialog').close();document.addEventListener('keydown',e=>{if(e.key==='Escape'){pause();$('close').click()}if(e.key==='/'&&!['INPUT','TEXTAREA','SELECT'].includes(document.activeElement.tagName)) {e.preventDefault();$('finder').focus()}});document.addEventListener('visibilitychange',()=>{if(document.hidden)pause()});reduced.addEventListener('change',()=>{if(reduced.matches)pause()});window.addEventListener('beforeunload',saveView);window.addEventListener('hashchange',()=>{if(location.hash.slice(1)!==active.id)render(location.hash.slice(1))});
setTheme(Boolean(remembered.dark));render(location.hash.slice(1)||remembered.active||'journey');new ResizeObserver(()=>{if(active&&state().autoFit)fit()}).observe($('viewport'));window.__atlas={charts,select:render,getActive:()=>active.id,getState:()=>({...state()}),isPlaying:()=>playing,pause,showEdge,canonical};
